apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: <username>-group
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    name: <username>-group
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Memberships
metadata:
  name: <username>-membership
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    groupIdRef:
      name: <username>-group
      namespace: iam-management
    members:
      - <username>
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationResource
metadata:
  name: <username>-resource
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    resourceServerIdRef:
      name: <client-name>
      namespace: iam-management
    name: <username>-resource
    type: urn:<client-name>:resources:default
    ownerManagedAccess: true
    uris:
      - "/<username>/*"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientGroupPolicy
metadata:
  name: <username>-policy
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    resourceServerIdRef:
      name: <client-name>
      namespace: iam-management
    name: <username>-policy
    description: Group <username>-group policy
    logic: POSITIVE
    decisionStrategy: UNANIMOUS
    groups:
      - path: /<username>-group
        extendChildren: false
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationPermission
metadata:
  name: <username>-access
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    resourceServerIdRef:
      name: <client-name>
      namespace: iam-management
    name: <username>-access
    description: Group <username>-group access to /<username>/*
    type: resource
    decisionStrategy: UNANIMOUS
    resources:
      - <username>-resource
    policies:
      - <username>-policy
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
