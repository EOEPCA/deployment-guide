      {"Application Hub" = "building-blocks/application-hub.md"}
    ]},
    {"Platform Operations" = [
      {"Resource Health" = "building-blocks/resource-health.md"},
      {"Application Quality" = "building-blocks/application-quality.md"},
      {"Notification & Automation" = "building-blocks/notification-automation.md"},
      {"Operations" = "building-blocks/operations.md"}
    ]}
  ]},
  {"Further EOEPCA+ Documentation" = "https://eoepca.readthedocs.io/"}
]

# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Use the classic variant to preserve Material for MkDocs look and feel
variant = "classic"

custom_dir = "overrides"
logo = "img/favicon.ico"
favicon = "img/favicon.ico"
language = "en"

features = [
    "navigation.footer",
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
    "content.tooltips",
    "content.tabs.link",
    "search.suggest",
    "search.highlight",
    "search.share",
]

# NOTE: [[project.theme.palette]] (array-of-tables) must come AFTER every
# plain key in [project.theme] (e.g. `features`) - once a [[...]] table is
# opened, subsequent bare `key = value` lines attach to that sub-table, not
# back to [project.theme].
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-sunny", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-night", name = "Switch to light mode" }

# ----------------------------------------------------------------------------
# Markdown extensions
# The following includes the zensical defaults plus extensions from mkdocs.yml
# ----------------------------------------------------------------------------
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = "⚓︎"
toc_depth = 4
[project.markdown_extensions.smarty]
[project.markdown_extensions.sane_lists]
[project.markdown_extensions.admonition]
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
