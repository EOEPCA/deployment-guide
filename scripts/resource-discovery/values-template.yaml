global:
  namespace: resource-discovery

ingress:
  enabled: false

db:
  enabled: true
  volume_storageclass: {{ getenv "PERSISTENT_STORAGECLASS" }}
  volume_access_modes: ReadWriteOnce
{{- if getenv "RESOURCE_DISCOVERY_DB_PASSWORD" "" }}
  user: pycsw
  pass: {{ getenv "RESOURCE_DISCOVERY_DB_PASSWORD" }}
{{- end }}

pycsw:
  image:
    repository: geopython/pycsw
    tag: "eoepca-staging"
    pullPolicy: Always
  replicas: 1
  config:
    server:
      url: {{ getenv "HTTP_SCHEME" }}://resource-catalogue.{{ getenv "INGRESS_HOST" }}/
    federatedcatalogues:
      - id: fedcat01
        type: OARec
        title: WIS2 discovery metadata
        url: https://wis2-gdc.weather.gc.ca/collections/wis2-discovery-metadata
      - id: fedcat02
        type: STAC-API
        title: Copernicus Data Space Ecosystem (CDSE) asset-level STAC catalogue
        url: https://stac.dataspace.copernicus.eu/v1
        collections:
          - ccm-sar
      - id: arctic-sdi-csw
        type: CSW
        title: Arctic SDI
        url: https://catalogue.arctic-sdi.org/csw
    # Transactions are intentionally left disabled (chart default) on the
    # public, unauthenticated catalogue. Enable RESOURCE_DISCOVERY_ENABLE_IAM
    # for a transactional endpoint gated by IAM + OPA instead.
    metadata:
      identification:
        title: EOEPCA+ Resource Catalogue
        description: EOEPCA+ Resource Catalogue
        keywords:
          - EOEPCA+
          - Earth observation
          - discovery
        license:
          name: CC-BY 4.0 license
          url: https://creativecommons.org/licenses/by/4.0
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0
        url: https://eoepca.org
      provider:
        name: EOEPCA+
        url: https://eoepca.org/
    repository:
      facets:
        - type