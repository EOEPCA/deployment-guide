apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: resource-catalogue
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: resource-catalogue
    accessType: PUBLIC
    clientId: resource-catalogue
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    fullScopeAllowed: false
    serviceAccountsEnabled: false
    oauth2DeviceAuthorizationGrantEnabled: true
    rootUrl: {{ getenv "HTTP_SCHEME" }}://resource-catalogue-protected.{{ getenv "INGRESS_HOST" }}
    webOrigins:
      - {{ getenv "HTTP_SCHEME" }}://resource-catalogue-protected.{{ getenv "INGRESS_HOST" }}
    validRedirectUris:
      - {{ getenv "HTTP_SCHEME" }}://resource-catalogue-protected.{{ getenv "INGRESS_HOST" }}/*
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: records-editor
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: records_editor
    clientIdRef:
      name: resource-catalogue
      policy:
        resolution: Required
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: resource-catalogue-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: resource-catalogue-admin
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: resource-catalogue-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: resource-catalogue-admin
      policy:
        resolution: Required
    roleIdsRefs:
      - name: records-editor
        policy:
          resolution: Required
