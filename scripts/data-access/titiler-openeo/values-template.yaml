image:
  tag: "v0.17.0"

{{- if eq (getenv "INGRESS_CLASS") "nginx" }}
ingress:
  enabled: true
  className: "nginx"
  annotations:
    {{- range $key, $value := (datasource "annotations") }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
        - path: /openeo(/|$)(.*)
          pathType: ImplementationSpecific
  {{- if eq ( getenv "HTTP_SCHEME" ) "https" }}
  tls:
    - secretName: "eoapi-tls"
      hosts:
        - eoapi.{{ getenv "INGRESS_HOST" }}
  {{- end }}
{{- else }}
ingress:
  enabled: false
{{- end }}

stac:
  apiUrl: "{{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/stac"

env:
  TITILER_OPENEO_API_ROOT_PATH: "/openeo/"
  {{- if ne (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}
  # Required: `auth.basic.users` below has no effect in this chart version.
  TITILER_OPENEO_AUTH_USERS: '{"{{ getenv "OPENEO_BASIC_AUTH_USER" }}": {"password": "{{ getenv "OPENEO_BASIC_AUTH_PASSWORD" }}", "roles": ["user"]}}'
  {{- end }}

{{- if eq (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}
auth:
  method: "oidc"
  basic:
    enabled: false
  oidc:
    enabled: true
    clientId: "{{ getenv "EOAPI_CLIENT_ID" }}"
    wellKnownUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
    redirectUrl: "{{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/openeo/"
{{- else }}
# Credentials generated by configure-data-access.sh.
auth:
  method: "basic"
  basic:
    enabled: true
    users:
      - username: "{{ getenv "OPENEO_BASIC_AUTH_USER" }}"
        password: "{{ getenv "OPENEO_BASIC_AUTH_PASSWORD" }}"
{{- end }}
