apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: eoapi
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: eoapi
    accessType: PUBLIC
    clientId: {{ getenv "EOAPI_CLIENT_ID" }}
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true # allow for now to simplify testing
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    oauth2DeviceAuthorizationGrantEnabled: true
    rootUrl: {{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}
    webOrigins:
    - '*'
    validRedirectUris:
    - '*'
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientDefaultScopes
metadata:
  name: eoapi-default-scopes
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    defaultScopes:
      - profile
      - roles
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientOptionalScopes
metadata:
  name: eoapi-optional-scopes
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    optionalScopes:
      - email
      - offline_access
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: eoapi-audience-mapper
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    realmId: {{ getenv "REALM" }}
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    name: eoapi-audience
    config:
      "included.client.audience": "{{ getenv "EOAPI_CLIENT_ID" }}"
      "access.token.claim": "true"
      "id.token.claim": "false"
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: stac-editor
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: stac_editor
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: data-access-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: data-access-admin
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: data-access-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: data-access-admin
      policy:
        resolution: Required
    roleIdsRefs:
    - name: stac-editor
      policy:
        resolution: Required
