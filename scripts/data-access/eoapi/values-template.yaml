{{- if eq (getenv "INGRESS_CLASS") "nginx" }}
ingress:
  enabled: true
  className: "nginx"
  annotations:
    {{- range $key, $value := (datasource "annotations") }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
  host: "eoapi.{{ getenv "INGRESS_HOST" }}"
  {{- if eq ( getenv "HTTP_SCHEME" ) "https" }}
  tls:
    enabled: true
    certManager: false
    secretName: "eoapi-tls"
  {{- end }}
{{- else }}
ingress:
  enabled: false
{{- end }}

{{- if eq (getenv "USE_EXTERNAL_POSTGRES") "yes" }}
postgresql:
  type: "external-secret"
  external:
    existingSecret:
      name: "{{ getenv "POSTGRES_EXTERNAL_SECRET_NAME" }}"
      keys:
        username: "user"
        password: "password"
        host: "host"
        port: "port"
        database: "dbname"
postgrescluster:
  enabled: false
{{- else }}
postgresql:
  type: "postgrescluster"
postgrescluster:
  enabled: true
  postgresVersion: 16
  postGISVersion: "3.4"
  pgBouncerReplicas: 1
  monitoring: false
  backupsEnabled: true
  backupsStorageClassName: {{ getenv "PERSISTENT_STORAGECLASS" }}
  backupsSize: 100Mi
  instances:
    - name: eoapi
      replicas: {{ getenv "POSTGRES_REPLICAS" | default "1" }}
      dataVolumeClaimSpec:
        storageClassName: {{ getenv "PERSISTENT_STORAGECLASS" }}
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ getenv "POSTGRES_STORAGE_SIZE" | default "1Gi" }}
{{- end }}

pgstacBootstrap:
  enabled: true
  settings:
    pgstacSettings:
      use_queue: "true"
      update_collection_extent: "false"
    envVars:
      KEEP_ALIVE: "false"
  queueProcessor:
    schedule: "0 * * * *"
  extentUpdater:
    schedule: "0 */12 * * *"

raster:
  enabled: true
  ingress:
    path: "/raster"
  overrideRootPath: "/"
  settings:
    envVars:
      AWS_S3_ENDPOINT: "{{ getenv "S3_ENDPOINT" }}"
      AWS_VIRTUAL_HOSTING: "FALSE"
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
    envSecrets:
      - data-access
    resources:
      requests:
        memory: "3072Mi"

multidim:
  enabled: true
  ingress:
    path: "/multidim"
  overrideRootPath: "/"
  settings:
    envVars:
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
    envSecrets:
      - data-access
    resources:
      requests:
        memory: "1024Mi"

stac:
  enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    type: "cpu"
    targets:
      cpu: 50
  settings:
    envVars:
      {{- if eq (getenv "ENABLE_TRANSACTIONS") "yes" }}
      ENABLE_TRANSACTIONS_EXTENSIONS: "TRUE"
      {{- end }}
      STAC_FASTAPI_TITLE: "EOEPCA STAC API"
      STAC_FASTAPI_DESCRIPTION: "A STAC Catalog for the Earth Observation Exploitation Platform Common Architecture (EOEPCA)"
      WEB_CONCURRENCY: "2"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "3"
    resources:
      limits:
        cpu: "1280m"
        memory: "1536Mi"
      requests:
        cpu: "512m"

vector:
  enabled: true
  settings:
    resources:
      limits:
        memory: "1536Mi"
      requests:
        memory: "1024Mi"
    envVars:
      TIPG_DEBUG: "True"
      TIPG_CATALOG_TTL: "30"
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
{{- if eq (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}
stac-auth-proxy:
  enabled: true
  image:
    tag: "v1.1.0"
  service:
    port: 8080
  env:
    UPSTREAM_URL: "http://eoapi-stac.data-access.svc.cluster.local:8080"
    OIDC_DISCOVERY_URL: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
    # Without this, stac-auth-proxy's own health check defaults to an unreachable
    # localhost target and the pod never becomes ready.
    OIDC_DISCOVERY_INTERNAL_URL: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
    COLLECTIONS_FILTER_CLS: stac_auth_proxy.eoepca_filters:CollectionsFilter
    ITEMS_FILTER_CLS: stac_auth_proxy.eoepca_filters:ItemsFilter
    ALLOWED_JWT_AUDIENCES: "{{ getenv "EOAPI_CLIENT_ID" }}"
    STAC_EDITOR_CLIENT_IDS: "{{ getenv "EOAPI_CLIENT_ID" }}"
    STAC_EDITOR_ROLE: "stac_editor"
    PUBLIC_ENDPOINTS: |
      {
        "^/$": ["GET"],
        "^/api.html$": ["GET"],
        "^/api$": ["GET"],
        "^/conformance$": ["GET"],
        "^/docs/oauth2-redirect": ["GET"],
        "^/healthz": ["GET"],
        "^/_mgmt/ping": ["GET"]
      }
    ROOT_PATH: "/stac"
    SWAGGER_UI_INIT_OAUTH: |
      {
        "clientId": "{{ getenv "EOAPI_CLIENT_ID" }}",
        "usePkceWithAuthorizationCodeGrant": true
      }
  extraVolumes:
    - name: filters
      configMap:
        name: stac-auth-proxy-filters
  extraVolumeMounts:
    - name: filters
      mountPath: /app/src/stac_auth_proxy/eoepca_filters.py
      subPath: eoepca_filters.py
      readOnly: true
  startupProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 2
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 60
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 5
    failureThreshold: 3
{{- else }}
stac-auth-proxy:
  enabled: false
{{- end }}
{{- if eq (getenv "ENABLE_EOAPI_NOTIFIER") "yes" }}
eoapi-notifier:
  enabled: true
  config:
    sources:
      - type: pgstac
        config:
          channel: "pgstac_items_change"
          connection:
            {{- if eq (getenv "USE_EXTERNAL_POSTGRES") "yes" }}
            existingSecret:
              name: "{{ getenv "POSTGRES_EXTERNAL_SECRET_NAME" }}"
              keys:
                username: "user"
                password: "password"
                host: "host"
                port: "port"
                database: "dbname"
            {{- else }}
            # For internal PostgreSQL, reference the secret created by postgres operator
            existingSecret:
              name: "eoapi-pguser-eoapi"
              keys:
                username: "user"
                password: "password"
                host: "host"
                port: "port"
                database: "dbname"
            {{- end }}
    outputs:
      - type: cloudevents
        config:
          source: /eoapi/pgstac
          event_type: org.eoapi.stac.item
          destination:
            ref:
              apiVersion: eventing.knative.dev/v1
              kind: Broker
              name: primary
              namespace: default
{{- else }}
# eoapi-notifier disabled
eoapi-notifier:
  enabled: false
{{- end }}
browser:
  catalogUrl: "{{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/stac"
  catalogTitle: "EOEPCA Data Catalog"
  catalogImage: "https://eoepca.org/media_portal/images/eoepca_logo_no_bg.original.png"
  footerLinks:
    - label: "Website"
      url: "https://eoepca.org/"
    - label: "Documentation"
      url: "https://docs.eoepca.org/"
  {{- if eq (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}
  authConfig:
    type: "openIdConnect"
    openIdConnectUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
    oidcConfig:
      client_id: "{{ getenv "EOAPI_CLIENT_ID" }}"
      redirect_uri: "{{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/browser/auth"
  {{- end }}