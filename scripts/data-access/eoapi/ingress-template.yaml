apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: stac
  namespace: data-access
spec:
  http:
  - name: manager-redirect
    websocket: true
    backends:
    - serviceName: stac-manager
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /manager
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /manager/
  - name: manager-route
    websocket: true
    backends:
    - serviceName: stac-manager
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /manager/
      - /manager/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/manager)($|/.*)
        - $2
      enable: true
    - name: cors
      enable: true
  - name: browser-redirect
    backends:
    - serviceName: eoapi-browser
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /browser
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /browser/
  - name: browser-route
    backends:
    - serviceName: eoapi-browser
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /browser/
      - /browser/*
  - name: vector-redirect
    backends:
    - serviceName: eoapi-vector
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /vector
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /vector/
  - name: vector-route
    backends:
    - serviceName: eoapi-vector
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /vector/
      - /vector/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/vector)($|/.*)
        - $2
      enable: true
  - name: multidim-redirect
    backends:
    - serviceName: eoapi-multidim
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /multidim
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /multidim/
  - name: multidim-route
    backends:
    - serviceName: eoapi-multidim
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /multidim/
      - /multidim/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/multidim)($|/.*)
        - $2
      enable: true
  - name: raster-redirect
    backends:
    - serviceName: eoapi-raster
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /raster
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /raster/
  - name: raster-route
    backends:
    - serviceName: eoapi-raster
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /raster/
      - /raster/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/raster)($|/.*)
        - $2
      enable: true
  - name: openeo-redirect
    backends:
    - serviceName: titiler-openeo
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /openeo
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /openeo/
  - name: openeo-route
    backends:
    - serviceName: titiler-openeo
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /openeo/
      - /openeo/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/openeo)($|/.*)
        - $2
      enable: true
  - name: stac-redirect
    priority: 100
    backends:
    - serviceName: {{ if eq (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}eoapi-stac-auth-proxy{{ else }}eoapi-stac{{ end }}
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      methods:
      - GET
      paths:
      - /stac
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /stac/
    - name: cors
      enable: true
    # APISIX forwards its own internal TLS listener port as X-Forwarded-Port, which
    # stac-fastapi uses to build self-referential links - override it to the real
    # public-facing port or every href in STAC responses gets a bogus port suffix.
    - name: proxy-rewrite
      config:
        headers:
          set:
            X-Forwarded-Port: "{{ if eq (getenv "HTTP_SCHEME") "https" }}443{{ else }}80{{ end }}"
      enable: true
  - name: stac-route
    priority: 10
    backends:
    - serviceName: {{ if eq (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}eoapi-stac-auth-proxy{{ else }}eoapi-stac{{ end }}
      servicePort: 8080
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /stac/
      - /stac/*
    plugins:
    - name: proxy-rewrite
      config:
        {{- if ne (getenv "DATA_ACCESS_ENABLE_IAM") "yes" }}
        regex_uri:
        - ^(/stac)($|/.*)
        - $2
        {{- end }}
        headers:
          set:
            X-Forwarded-Port: "{{ if eq (getenv "HTTP_SCHEME") "https" }}443{{ else }}80{{ end }}"
      enable: true
    - name: cors
      enable: true
  - name: docs-redirect
    backends:
    - serviceName: eoapi-doc-server
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /docs
      - /
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /docs/
  - name: docs-route
    backends:
    - serviceName: eoapi-doc-server
      servicePort: 80
    match:
      hosts:
      - eoapi.{{ getenv "INGRESS_HOST" }}
      paths:
      - /docs/
      - /docs/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/docs)($|/.*)
        - $2
      enable: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: eoapi-tls
  namespace: data-access
spec:
  hosts:
  - eoapi.{{ getenv "INGRESS_HOST" }}
  secret:
    name: eoapi-tls-cert
    namespace: data-access
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: eoapi-tls-cert
  namespace: data-access
spec:
  secretName: eoapi-tls-cert
  dnsNames:
  - eoapi.{{ getenv "INGRESS_HOST" }}
  issuerRef:
    name: {{ getenv "CLUSTER_ISSUER" }}
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: eoapisupport-tls-cert
  namespace: data-access
spec:
  secretName: eoapisupport-tls-cert
  dnsNames:
  - eoapisupport.{{ getenv "INGRESS_HOST" }}
  issuerRef:
    name: {{ getenv "CLUSTER_ISSUER" }}
    kind: ClusterIssuer
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: eoapisupport-tls
  namespace: data-access
spec:
  hosts:
  - eoapisupport.{{ getenv "INGRESS_HOST" }}
  secret:
    name: eoapisupport-tls-cert
    namespace: data-access