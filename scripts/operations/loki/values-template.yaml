deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-08-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    bucketNames:
      chunks: {{ getenv "S3_BUCKET" }}
      ruler: {{ getenv "S3_BUCKET" }}
      admin: {{ getenv "S3_BUCKET" }}
    type: s3
    s3:
      endpoint: {{ getenv "S3_HOST" }}
      region: default
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
  limits_config:
    retention_period: {{ getenv "LOKI_RETENTION_HOURS" }}h
  compactor:
    retention_enabled: true
    delete_request_store: s3
    retention_delete_delay: 2h
    compaction_interval: 10m

singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
  extraVolumes:
    - name: loki-tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: loki-tmp
      mountPath: /var/loki
  persistence:
    enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack