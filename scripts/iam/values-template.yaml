fullnameOverride: iam

global:
  storageClass: {{ getenv "PERSISTENT_STORAGECLASS" | quote }}
  security:
    allowInsecureImages: true

iam: &iam
  keycloak:
    enabled: true
    createRoute: true
    url: &kcurl "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}"
    internalUrl: ""
    hosts:
      - {{ getenv "KEYCLOAK_HOST" | quote }}
    paths:
      - /*
    configuration:
      useCrossplane: true
      useSecretGenerator: false
      createClients: false
      createSecretStore: false
      realm:
        create: true
        createUsingCrossplane: false
        name: &realmName {{ getenv "REALM" | quote }}
        displayName: EOEPCA
        customPlaceholders:
          test_password:
            secret:
              name: iam-keycloak
              key: test-user-password
          opa_client_secret:
            secret:
              name: opa-route
              key: client_secret
        customClients:
          - clientId: {{ getenv "OPA_CLIENT_ID" | quote }}
            name: Open Policy Agent
            enabled: true
            protocol: openid-connect
            publicClient: false
            clientAuthenticatorType: client-secret
            secret: ${opa_client_secret}
            serviceAccountsEnabled: true
            standardFlowEnabled: true
            directAccessGrantsEnabled: true
            authorizationServicesEnabled: true
            redirectUris:
              - "{{ getenv "HTTP_SCHEME" }}://opa.{{ getenv "INGRESS_HOST" }}/.apisix/redirect"
            webOrigins:
              - "{{ getenv "HTTP_SCHEME" }}://opa.{{ getenv "INGRESS_HOST" }}"
            # Required: the opa-route ApisixRoute needs an "aud" claim equal to the client ID.
            protocolMappers:
              - name: audience-opa
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.client.audience: {{ getenv "OPA_CLIENT_ID" | quote }}
                  access.token.claim: "true"
        customUsers:
          - username: {{ getenv "KEYCLOAK_TEST_ADMIN" | quote }}
            enabled: true
            email: "{{ getenv "KEYCLOAK_TEST_ADMIN" }}@eoepca.org"
            emailVerified: true
            firstName: {{ getenv "KEYCLOAK_TEST_ADMIN" | quote }}
            lastName: Admin
            credentials:
              - type: password
                value: ${test_password}
                temporary: false
            clientRoles:
              realm-management:
                - realm-admin
        customSettings:
          loginWithEmailAllowed: false
          eventsEnabled: true
          eventsExpiration: 1800
      provider:
        existingConfigRef: ""
        create: true
        createServiceAccount: true
        clientSecret: ""
        secretRef:
          name: keycloak-provider
          key: credentials
    tls:
      enabled: false
      autoGenerate: true
      tlsSecretRef: &tlsSecretRef ~
    cors:
      enabled: false
    postgres:
      enabled: true
      host: &pgHost iam-postgresql
      database: &pgDatabase keycloak
      username: keycloak
      password: ""
      secretRef: postgresql

  opa:
    enabled: true
    inline: false
    createRoute: true
    url: "{{ getenv "HTTP_SCHEME" }}://opa.{{ getenv "INGRESS_HOST" }}"
    hosts:
      - "opa.{{ getenv "INGRESS_HOST" }}"
    paths:
      - /*
    clientId: {{ getenv "OPA_CLIENT_ID" | quote }}
    clientSecretRef: opa-route
    image:
      registry: docker.io
      repository: openpolicyagent/opa
      tag: 1.19.1
      pullPolicy: IfNotPresent

  apisix:
    enabled: false
    ingressClassName: &ingressClassName {{ getenv "INGRESS_CLASS" | quote }}

  config:
    enabled: true
    targetNamespace: iam-management
    propagateSecrets: false

keycloak-operator:
  operator:
    replicaCount: 1
  keycloak:
    enabled: true
    instances: 1
    bootstrapAdmin:
      user:
        secret: keycloak-admin
    db:
      vendor: postgres
      host: *pgHost
      port: 5432
      database: *pgDatabase
      usernameSecret:
        name: postgresql
        key: username
      passwordSecret:
        name: postgresql
        key: password
    http:
      tlsSecret: *tlsSecretRef
    hostname:
      hostname: *kcurl
    ingress:
      enabled: false
    proxy:
      headers: xforwarded
    realmimport:
      enabled: false

opal:
  enabled: true
  broadcastReplicas: 1
  image:
    client:
      registry: docker.io
      repository: permitio/opal-client
      tag: 0.9.6
    server:
      registry: docker.io
      repository: permitio/opal-server
      tag: 0.9.6
    pgsql:
      registry: docker.io
      repository: postgres
      tag: alpine
  server:
    port: 7002
    policyRepoUrl: https://github.com/EOEPCA/iam-policies.git
    policyRepoSshKey: null
    policyRepoClonePath: null
    policyRepoMainBranch: main
    pollingInterval: 300
    dataConfigSources:
      config:
        entries: []
    broadcastUri: null
    broadcastPgsql: true
    uvicornWorkers: 4
    replicas: 1
  client:
    port: 7000
    opaPort: 8181
    replicas: 1
    opaStartupData:
      config.yaml: |
        decision_logs:
          # Change this to true to get more information about authorization in the OPA pod's logs
          console: false
      policy.rego: |
        package system.authz
        import rego.v1
        jwks_request(url) := http.send({
          "url": url,
          "method": "GET",
          "force_cache": true,
          "force_cache_duration_seconds": 3600
        })
        jwks := jwks_request("http://iam-keycloak-operator-service:8080/realms/{{ getenv "REALM" }}/protocol/openid-connect/certs").raw_body
        default allow_policy_evaluation := false
        allow_policy_evaluation if {
          input.method in ["GET", "POST"]
          "v1" == input.path[0]
          "data" == input.path[1]
          "system" != input.path[2]
        }
        allow_policy_evaluation if {
          "POST" == input.method
          ["v1", "query"] == input.path
        }
        allow_policy_evaluation if {
          "GET" == input.method
          input.path in [[""], ["health"]]
        }
        default verified_claims = null
        verified_claims := claims if {
          [type, token] := split(input.headers["Authorization"][_], " ")
          type == "Bearer"
          io.jwt.verify_rs256(token, jwks) == true
          claims := io.jwt.decode(token)[1]
        }
        default allow := false
        allow if {
          "root$secret" == input.identity
        }
        allow if {
          not input.headers["Authorization"]
          allow_policy_evaluation == true
        }
        allow if {
          claims := verified_claims
          claims != null
          allow_policy_evaluation == true
        }
    extraEnv:
      OPAL_POLICY_STORE_URL: http://iam-opa:8181
      OPAL_POLICY_STORE_AUTH_TYPE: token
      OPAL_POLICY_STORE_AUTH_TOKEN: root$secret
      OPAL_DATA_UPDATER_ENABLED: False
      OPAL_INLINE_OPA_ENABLED: False
      OPAL_INLINE_OPA_LOG_FORMAT: full
      OPAL_INLINE_OPA_CONFIG: >-
        {
          "addr": "http://0.0.0.0:8181",
          "authentication": "token",
          "authorization": "basic",
          "files": [ "/opt/opa/startup-data/policy.rego" ],
          "config_file":"/opt/opa/startup-data/config.yaml"
        }

iam-bb-config:
  enabled: true
  iam: *iam
