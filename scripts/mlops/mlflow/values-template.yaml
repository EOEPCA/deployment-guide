image:
  repository: eoepca/mlflow-sharinghub
  pullPolicy: IfNotPresent

mlflowSharinghub:
  sharinghubUrl: {{ getenv "HTTP_SCHEME" }}://sharinghub.{{ getenv "INGRESS_HOST" }}
  sharinghubStacCollection: ai-model
  sharinghubAuthDefaultToken: false
  artifactsDestination: s3://{{ getenv "S3_BUCKET_MLFLOW" }}
  # Both secret-key and backend-store-uri are read from this one Secret
  # (see apply-secrets.sh) - the chart uses existingSecret for both.
  existingSecret: mlflow-sharinghub
  backendStoreUriSecret: true

podSecurityContext:
  fsGroup: 999

s3:
  enabled: true
  endpointUrl: {{ getenv "S3_ENDPOINT" }}

postgresql:
  enabled: false
  auth:
    existingSecret: mlflow-sharinghub-postgres
  global:
    storageClass: {{ getenv "PERSISTENT_STORAGECLASS" }}
  persistence:
    storageClass: {{ getenv "PERSISTENT_STORAGECLASS" }}


ingress:
  enabled: false
