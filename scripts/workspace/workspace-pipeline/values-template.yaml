environmentconfig:
  iam:
    realm: {{ getenv "REALM" "eoepca" }}
    extraAudiences:
      - {{ getenv "WORKSPACE_API_CLIENT_ID" }}
  ingress:
    class: {{ getenv "INGRESS_CLASS" }}
    domain: {{ getenv "INGRESS_HOST" }}
    secret: workspace-tls
  storage:
    endpoint: {{ getenv "S3_ENDPOINT" }}
    forcePathStyle: true
    provider: Other
    region: {{ getenv "S3_REGION" }}
    secretNamespace: workspace
    type: s3
  storageClasses:
    allowed: []
  network:
    externalEgressCIDRs:
      - "0.0.0.0/0"
      - "::/0"
    serviceCIDR: {{ getenv "SERVICE_CIDR" }}
    podCIDRs:
{{- range (getenv "POD_CIDRS" | strings.Split ",") }}
      - {{ . }}
{{- end }}
    blacklistIPs:
      - "169.254.169.254/32"
  packages:
    - name: awscli
      files:
        - image:
            url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
    - name: rclone
      files:
        - image:
            url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
  auth:
    type: none
  defaults:
    quota:
      storage: 8Gi
      budget: x-large
    security:
      externalEgress: true
