apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workspace-session-iam
spec:
  admission: true
  background: false
  rules:
    - name: generate-apisix-oidc-plugin-config-for-workspace-sessions
      match:
        any:
          - resources:
              kinds:
                - Ingress
              selector:
                matchLabels:
                  training.educates.dev/application: workshop
                  training.educates.dev/component: session
      preconditions:
        all:
          - key: "{{ request.object.spec.ingressClassName || '' }}"
            operator: Equals
            value: apisix
          - key: "{{ (request.object.spec.rules || [])[?host != null && ends_with(host, '.${INGRESS_HOST}')] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" || '' }}"
            operator: NotEquals
            value: ""
      generate:
        apiVersion: apisix.apache.org/v2
        kind: ApisixPluginConfig
        name: "workspace-session-oidc-{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" }}"
        namespace: "{{ request.namespace }}"
        synchronize: false
        data:
          metadata:
            labels:
              training.educates.dev/application: workshop
              training.educates.dev/component: session
              training.educates.dev/environment.name: "{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" }}"
          spec:
            plugins:
              - name: openid-connect
                enable: true
                config:
                  discovery: "${HTTP_SCHEME}://${KEYCLOAK_HOST}/realms/${REALM}/.well-known/openid-configuration"
                  use_jwks: true
                  bearer_only: false
                  set_access_token_header: true
                  access_token_in_authorization_header: true
                  set_id_token_header: false
                  set_userinfo_header: false
                  session:
                    secret: "{{ random('[A-Za-z0-9]{32}') }}"
                secretRef: workspace-api-keycloak-client
    - name: add-apisix-oidc-plugin-config-for-workspace-sessions
      match:
        any:
          - resources:
              kinds:
                - Ingress
              selector:
                matchLabels:
                  training.educates.dev/application: workshop
                  training.educates.dev/component: session
      preconditions:
        all:
          - key: "{{ request.object.spec.ingressClassName || '' }}"
            operator: Equals
            value: apisix
          - key: "{{ (request.object.spec.rules || [])[?host != null && ends_with(host, '.${INGRESS_HOST}')] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" || '' }}"
            operator: NotEquals
            value: ""
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              +(k8s.apisix.apache.org/plugin-config-name): "workspace-session-oidc-{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" }}"
              +(k8s.apisix.apache.org/enable-websocket): "true"
    # Kyverno stamps its own generate.kyverno.io/policy-namespace tracking label
    # onto every resource this ClusterPolicy generates - empty, since a
    # ClusterPolicy has no namespace. APISIX's ingress controller rejects any
    # label with an empty string value when syncing an ApisixPluginConfig
    # (400: "string too short, expected at least 1, got 0"), which silently
    # breaks every Datalab session's OIDC protection. Fix it at admission time,
    # before the object is ever synced to APISIX.
    - name: fix-empty-generate-tracking-label-on-plugin-config
      match:
        any:
          - resources:
              kinds:
                - ApisixPluginConfig
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              generate.kyverno.io/policy-namespace: kyverno
