apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: "{{ getenv "WORKSPACE_PIPELINE_CLIENT_ID" }}"
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientId: {{ getenv "WORKSPACE_PIPELINE_CLIENT_ID" }}
    name: Workspace Pipelines
    description: Workspace Pipelines Admin
    enabled: true
    accessType: CONFIDENTIAL
    rootUrl: {{ getenv "HTTP_SCHEME" }}://workspace-pipeline.{{ getenv "INGRESS_HOST" }}
    baseUrl: {{ getenv "HTTP_SCHEME" }}://workspace-pipeline.{{ getenv "INGRESS_HOST" }}
    adminUrl: {{ getenv "HTTP_SCHEME" }}://workspace-pipeline.{{ getenv "INGRESS_HOST" }}
    serviceAccountsEnabled: true
    directAccessGrantsEnabled: true
    standardFlowEnabled: true
    oauth2DeviceAuthorizationGrantEnabled: true
    useRefreshTokens: true
    authorization:
      - allowRemoteResourceManagement: false
        decisionStrategy: UNANIMOUS
        keepDefaults: true
        policyEnforcementMode: ENFORCING
    validRedirectUris:
      - "/*"
    webOrigins:
      - "/*"
    clientSecretSecretRef:
      name: workspace-pipeline-keycloak-client
      key: client_secret
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
# Adopts Keycloak's built-in realm-management client so role grants below can reference it.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: realm-management
  namespace: iam-management
  annotations:
    crossplane.io/external-name: "{{ getenv "REALM_MANAGEMENT_CLIENT_UUID" }}"
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientId: realm-management
    enabled: true
    accessType: BEARERONLY
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  managementPolicies:
    - Observe
{{- range (coll.Slice "manage-users" "manage-authorization" "manage-clients" "create-client" "realm-admin") }}
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientServiceAccountRole
metadata:
  name: workspace-pipeline-client-{{ . }}
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    serviceAccountUserClientIdRef:
      name: {{ getenv "WORKSPACE_PIPELINE_CLIENT_ID" }}
      namespace: iam-management
    clientIdRef:
      name: realm-management
      namespace: iam-management
    role: {{ . }}
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
{{- end }}
