apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: workspace-api
  namespace: workspace
spec:
  ingressClassName: {{ getenv "INGRESS_CLASS" }}
  http:
    - name: workspace-api-root-redirect
      match:
        hosts:
          - workspace-api.{{ getenv "INGRESS_HOST" }}
        paths:
          - /
      plugins:
        - name: redirect
          enable: true
          config:
            uri: /workspaces
            ret_code: 302
      backends:
        - serviceName: workspace-api
          servicePort: 8181
    - name: workspace-api-no-auth
      match:
        hosts:
          - workspace-api.{{ getenv "INGRESS_HOST" }}
        paths:
          - "/metrics*"
          - "/probe*"
          - "/ui*"
      backends:
        - serviceName: workspace-api
          servicePort: 8181
      plugins: []
    - name: workspace-api-debug
      match:
        hosts:
          - workspace-api.{{ getenv "INGRESS_HOST" }}
        paths:
          - /debug*
      backends:
        - serviceName: workspace-api
          servicePort: 8181
      plugins:
        - name: openid-connect
          enable: true
          config:
            discovery: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
            timeout: 10
            use_jwks: true
            bearer_only: false
            set_access_token_header: true
            access_token_in_authorization_header: true
            set_id_token_header: true
            set_userinfo_header: true
            client_id: "{{ getenv "WORKSPACE_API_CLIENT_ID" }}"
            client_secret: ""
            session:
              secret: "{{ getenv "WORKSPACE_API_SESSION_SECRET" }}"
    - name: workspace-api-docs
      match:
        hosts:
          - workspace-api.{{ getenv "INGRESS_HOST" }}
        paths:
          - /docs*
          - /openapi.json*
      backends:
        - serviceName: workspace-api
          servicePort: 8181
    - name: workspace-api-auth
      match:
        hosts:
          - workspace-api.{{ getenv "INGRESS_HOST" }}
        paths:
          - /*
      backends:
        - serviceName: workspace-api
          servicePort: 8181
{{- if eq ( getenv "OIDC_WORKSPACE_ENABLED" ) "true" }}
      plugins:
        - name: openid-connect
          enable: true
          config:
            discovery: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/.well-known/openid-configuration"
            timeout: 10
            use_jwks: true
            bearer_only: false
            scope: openid roles
            set_access_token_header: true
            access_token_in_authorization_header: true
            set_id_token_header: false
            set_userinfo_header: false
            client_id: "{{ getenv "WORKSPACE_API_CLIENT_ID" }}"
            client_secret: ""
            session:
              secret: "{{ getenv "WORKSPACE_API_SESSION_SECRET" }}"
{{- end }}
{{- if eq ( getenv "HTTP_SCHEME" ) "https" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workspace-api
  namespace: workspace
spec:
  dnsNames:
    - workspace-api.{{ getenv "INGRESS_HOST" }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ getenv "CLUSTER_ISSUER" }}
  secretName: workspace-api-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: workspace-api
  namespace: workspace
spec:
  hosts:
    - workspace-api.{{ getenv "INGRESS_HOST" }}
  secret:
    name: workspace-api-tls
    namespace: workspace
{{- end }}
