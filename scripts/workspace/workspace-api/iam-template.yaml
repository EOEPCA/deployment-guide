apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientId: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
    name: Workspace API
    description: Workspace API OIDC
    enabled: true
    accessType: PUBLIC
    fullScopeAllowed: true
    rootUrl: {{ getenv "HTTP_SCHEME" }}://workspace-api.{{ getenv "INGRESS_HOST" }}
    baseUrl: {{ getenv "HTTP_SCHEME" }}://workspace-api.{{ getenv "INGRESS_HOST" }}
    adminUrl: {{ getenv "HTTP_SCHEME" }}://workspace-api.{{ getenv "INGRESS_HOST" }}
    serviceAccountsEnabled: false
    directAccessGrantsEnabled: true
    standardFlowEnabled: true
    oauth2DeviceAuthorizationGrantEnabled: true
    useRefreshTokens: true
    validRedirectUris:
      - "*"
    webOrigins:
      - "*"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}-audience-mapper
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
      namespace: iam-management
    realmId: {{ getenv "REALM" }}
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}-audience
    config:
      included.client.audience: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
      access.token.claim: "true"
      id.token.claim: "false"
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}-groups-mapper
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
      namespace: iam-management
    realmId: {{ getenv "REALM" }}
    protocol: openid-connect
    protocolMapper: oidc-group-membership-mapper
    name: groups
    config:
      full.path: "true"
      claim.name: groups
      access.token.claim: "true"
      id.token.claim: "true"
      userinfo.token.claim: "true"
      multivalued: "true"
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: workspace-api-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: admin
    clientIdRef:
      name: {{ getenv "WORKSPACE_API_CLIENT_ID" }}
      policy:
        resolution: Required
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: workspace-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: workspace-admin
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: workspace-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: workspace-admin
      policy:
        resolution: Required
    roleIdsRefs:
      - name: workspace-api-admin
        policy:
          resolution: Required
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Memberships
metadata:
  name: workspace-admin-members
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: workspace-admin
      policy:
        resolution: Required
    members:
      - {{ getenv "KEYCLOAK_TEST_ADMIN" }}
