---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: opensearch-user-role
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: opensearch_user
    description: Role for OpenSearch access via Resource Health
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-realm-roles-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: {{ getenv "RESOURCE_HEALTH_CLIENT_ID" }}
    name: realm roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-realm-role-mapper
    config:
      multivalued: "true"
      claim.name: roles
      jsonType.label: String
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-audience-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: {{ getenv "RESOURCE_HEALTH_CLIENT_ID" }}
    name: audience-account
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      # Required: without this mapper every request 403s with "Invalid authentication credentials".
      included.client.audience: account
      access.token.claim: "true"
      id.token.claim: "false"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: resource-health-opensearch-users
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    name: resource-health-opensearch-users
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: resource-health-opensearch-users
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: resource-health-opensearch-users
      policy:
        resolution: Required
    roleIdsRefs:
      - name: opensearch-user-role
        policy:
          resolution: Required
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Memberships
metadata:
  name: resource-health-opensearch-users-members
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    groupIdRef:
      name: resource-health-opensearch-users
      policy:
        resolution: Required
    members:
      - {{ getenv "KEYCLOAK_TEST_USER" }}
