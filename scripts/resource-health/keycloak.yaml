---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: opensearch-user-role
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    name: opensearch_user
    description: Role for OpenSearch access via Resource Health
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-realm-roles-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: resource-health
    name: realm roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-realm-role-mapper
    config:
      multivalued: "true"
      claim.name: roles
      jsonType.label: String
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-audience-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: resource-health
    name: audience-account
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      # Required: without this mapper every request 403s with "Invalid authentication credentials".
      included.client.audience: account
      access.token.claim: "true"
      id.token.claim: "false"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
# No Crossplane Roles resource here - KEYCLOAK_TEST_USER isn't a Crossplane User
# object, so the role is assigned via REST in the guide's "Assign the Realm Role" step.