---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: opensearch-user-role
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    name: opensearch_user
    description: Role for OpenSearch access via Resource Health
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-realm-roles-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: resource-health
    name: realm roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-realm-role-mapper
    config:
      multivalued: "true"
      claim.name: roles
      jsonType.label: String
      id.token.claim: "true"
      access.token.claim: "true"
      userinfo.token.claim: "true"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: resource-health-audience-mapper
  namespace: iam-management
spec:
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: resource-health
    name: audience-account
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      # check_api/telemetry_api validate OPEN_ID_CONNECT_AUDIENCE="account"
      # (see values-template.yaml); without this mapper the access token has
      # no "aud" claim at all and every request 403s with
      # "Invalid authentication credentials".
      included.client.audience: account
      access.token.claim: "true"
      id.token.claim: "false"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
# There is deliberately no Crossplane Roles resource here to assign
# opensearch_user to your test user: that CR needs a user.keycloak.m.crossplane.io
# User object to reference, but KEYCLOAK_TEST_USER is normally a plain Keycloak
# user created via the Admin REST API (see the IAM BB docs), not a Crossplane
# resource. Assign the role via REST instead - see the guide's "Assign the
# Realm Role" step below.