apiVersion: v1
kind: Secret
metadata:
  name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}-keycloak-client
  namespace: iam-management
stringData:
  client_secret: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_SECRET" }}
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}
  namespace: iam-management
spec:
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientId: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}
    name: Resource Registration
    description: Resource Registration OIDC
    enabled: true
    accessType: CONFIDENTIAL
    rootUrl: {{ getenv "HTTP_SCHEME" }}://registration-api.{{ getenv "INGRESS_HOST" }}
    baseUrl: {{ getenv "HTTP_SCHEME" }}://registration-api.{{ getenv "INGRESS_HOST" }}
    adminUrl: {{ getenv "HTTP_SCHEME" }}://registration-api.{{ getenv "INGRESS_HOST" }}
    serviceAccountsEnabled: true
    directAccessGrantsEnabled: true
    standardFlowEnabled: true
    oauth2DeviceAuthorizationGrantEnabled: true
    useRefreshTokens: true
    authorization:
      - allowRemoteResourceManagement: false
        decisionStrategy: UNANIMOUS
        keepDefaults: true
        policyEnforcementMode: ENFORCING
    validRedirectUris:
      - "/*"
    webOrigins:
      - "/*"
    clientSecretSecretRef:
      name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}-keycloak-client
      key: client_secret
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientServiceAccountRole
metadata:
  name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}-eoapi-stac-editor
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    roleRef:
      name: stac-editor
      policy:
        resolution: Required
    serviceAccountUserClientIdRef:
      name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}
      policy:
        resolution: Required
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientServiceAccountRole
metadata:
  name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}-resource-catalogue-records-editor
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: {{ getenv "REALM" }}
    clientIdRef:
      name: resource-catalogue
      policy:
        resolution: Required
    roleRef:
      name: records-editor
      policy:
        resolution: Required
    serviceAccountUserClientIdRef:
      name: {{ getenv "RESOURCE_REGISTRATION_IAM_CLIENT_ID" }}
      policy:
        resolution: Required
