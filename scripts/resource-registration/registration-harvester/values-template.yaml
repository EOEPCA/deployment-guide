# Operaton BPM engine
global:
  defaultStorageClass: {{ getenv "PERSISTENT_STORAGECLASS" }}

general:
  nameOverride: operaton

image:
  tag: "2.1.0"

ingress:
  enabled: false

database:
  credentialsSecretEnabled: true
  credentialsSecretName: registration-harvester-secret
  credentialsSecretKeys:
    username: OPERATON_DB_USERNAME
    password: OPERATON_DB_PASSWORD

postgres:
  enabled: true
  nameOverride: postgres
  architecture: standalone
  auth:
    database: operaton
    username: operaton
    existingSecret: registration-harvester-secret
    secretKeys:
      userPasswordKey: OPERATON_DB_PASSWORD
  metrics:
    enabled: false

bpmEngine:
  autoDeployment: false
  historyLevel: ACTIVITY
  adminUser:
    username: {{ getenv "OPERATON_ADMIN_USER" }}
    password: {{ getenv "OPERATON_ADMIN_PASSWORD" }}
