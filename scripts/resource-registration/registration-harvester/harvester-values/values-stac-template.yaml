harvester:
  image:
    repository: eoepca/registration-harvester
    pullPolicy: Always
    tag: 2.1.0-rc1
  secret:
    name: registration-harvester-secret
  eodata:
    enabled: true
    createPVC: false
    claimName: eodata
  config:
    log_level: INFO
    bpm_engine:
      url: http://registration-harvester-bpm-engine-operaton.resource-registration.svc.cluster.local:8080/engine-rest
      lock_duration: 300000  # 5 minutes
      retries: 3
      retry_timeout: 30000  # 30 seconds
      async_response_timeout: 30000 # 30 seconds
      timeout_delta_millis: 300000 # 5 minutes
      sleep_seconds: 15
      http_timeout_millis: 420000 # 7 minutes
{{- if eq (getenv "RESOURCE_REGISTRATION_PROTECTED_TARGETS") "yes" }}
    iam:
      enabled: true
      oidc_token_endpoint_url: http://iam-keycloak-operator-service.iam.svc.cluster.local:8080/realms/{{ getenv "REALM" }}/protocol/openid-connect/token
{{- end }}
    topics:
      stac_harvest_catalog:
        module: worker.stac.tasks
        handler: StacCatalogHandler
        lock_duration: 600000   # 10 minutes
        workers: 1
        parallel_tasks: 1
        retries: 5
      stac_harvest_collection:
        module: worker.stac.tasks
        handler: StacCollectionHandler
        lock_duration: 600000   # 10 minutes
        workers: 1
        parallel_tasks: 1
        retries: 5
      stac_harvest_item:
        module: worker.stac.tasks
        handler: StacItemHandler
        lock_duration: 600000   # 10 minutes
        workers: 1
        parallel_tasks: 1
        retries: 5
    handlers:
      StacCatalogHandler: {}
      StacCollectionHandler:
        timewindow_hours: 1
        stac_api_url: {{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/stac/
        stac_api_ca_cert: ""
        stac_api_user: ""
        stac_api_pw: ""
      StacItemHandler:
        stac_api_url: {{ getenv "HTTP_SCHEME" }}://eoapi.{{ getenv "INGRESS_HOST" }}/stac/
        stac_api_ca_cert: ""
        stac_api_user: ""
        stac_api_pw: ""
