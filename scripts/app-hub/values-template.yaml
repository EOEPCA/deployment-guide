ingress:
  enabled: false

jupyterhub:
  fullnameOverride: "application-hub"
  hub:
    baseUrl: /
    existingSecret: application-hub
    extraEnv:
      JUPYTERHUB_ENV: "dev"
      JUPYTERHUB_SINGLE_USER_IMAGE_NOTEBOOKS: "jupyter/minimal-notebook:2343e33dec46"
      APP_HUB_NAMESPACE: "app-hub"
      STORAGE_CLASS: {{ getenv "PERSISTENT_STORAGECLASS" }}
      RESOURCE_MANAGER_WORKSPACE_PREFIX: "ws"
      BASE_URL: /

      JUPYTERHUB_CRYPT_KEY:
        valueFrom:
          secretKeyRef:
            name: application-hub
            key: JUPYTERHUB_CRYPT_KEY

      OAUTH_CALLBACK_URL: {{ getenv "HTTP_SCHEME" }}://{{ getenv "APPHUB_PUBLIC_HOST" }}/hub/oauth_callback
      OAUTH_LOGOUT_REDIRECT_URL: {{ getenv "HTTP_SCHEME" }}://{{ getenv "APPHUB_PUBLIC_HOST" }}/hub/home
      OAUTH2_USERNAME_KEY: "preferred_username"

      OAUTH2_USERDATA_URL: {{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/protocol/openid-connect/userinfo
      OAUTH2_TOKEN_URL: {{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/protocol/openid-connect/token
      OAUTH2_AUTHORIZE_URL: {{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}/protocol/openid-connect/auth

      OAUTH_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: application-hub
            key: OAUTH_CLIENT_ID
      OAUTH_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: application-hub
            key: OAUTH_CLIENT_SECRET

    image:
      pullPolicy: Always

    db:
      pvc:
        storageClassName: {{ getenv "PERSISTENT_STORAGECLASS" }}

  singleuser:
    image:
      name: jupyter/minimal-notebook
      tag: "2343e33dec46"

nodeSelector:
  key: "{{ getenv "NODE_SELECTOR_KEY" }}"
  value: "{{ getenv "NODE_SELECTOR_VALUE" }}"
