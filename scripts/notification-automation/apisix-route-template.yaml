apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: notifications-wildcard-route
  namespace: knative-serving
spec:
  http:
    - name: knative-serving-default
      match:
        hosts:
          - "*.notifications.notifications.{{ getenv "INGRESS_HOST" }}"
        paths:
          - "/*"
      backends:
        - serviceName: kourier
          servicePort: 80
      plugins:
        - name: cors
          enable: true
{{- if eq ( getenv "HTTP_SCHEME" ) "https" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notifications-wildcard
  namespace: knative-serving
spec:
  dnsNames:
    - "*.notifications.notifications.{{ getenv "INGRESS_HOST" }}"
  issuerRef:
    kind: ClusterIssuer
    name: {{ getenv "DNS_CLUSTER_ISSUER" }}
  secretName: notifications-wildcard-tls
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: notifications-wildcard
  namespace: knative-serving
spec:
  hosts:
    - "*.notifications.notifications.{{ getenv "INGRESS_HOST" }}"
  secret:
    name: notifications-wildcard-tls
    namespace: knative-serving
{{- end }}
