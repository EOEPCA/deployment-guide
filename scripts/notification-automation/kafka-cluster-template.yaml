# KRaft mode (no ZooKeeper) - broker/controller storage and replicas live on the KafkaNodePool.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: notifications
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: {{ getenv "NA_KAFKA_REPLICAS" }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ getenv "NA_KAFKA_VOLUME_SIZE" }}
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: notifications
spec:
  kafka:
    version: {{ getenv "NA_KAFKA_VERSION" }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
  entityOperator:
    topicOperator: {}
    userOperator: {}
