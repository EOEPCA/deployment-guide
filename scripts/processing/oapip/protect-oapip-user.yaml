apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationResource
metadata:
  name: ${OAPIP_USER}-resource
  namespace: iam-management
spec:
  forProvider:
    realmId: ${REALM}
    resourceServerIdRef:
      name: ${OAPIP_CLIENT_ID}
      namespace: iam-management
    name: ${OAPIP_USER}-resource
    type: urn:${OAPIP_CLIENT_ID}:resources:default
    ownerManagedAccess: true
    uris:
      - "/${OAPIP_USER}/*"
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
# usersRefs.name is the Crossplane User object name (scripts/iam/eoepca-user-template.yaml), not the Keycloak username.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientUserPolicy
metadata:
  name: ${OAPIP_USER}-policy
  namespace: iam-management
spec:
  forProvider:
    realmId: ${REALM}
    resourceServerIdRef:
      name: ${OAPIP_CLIENT_ID}
      namespace: iam-management
    name: ${OAPIP_USER}-policy
    logic: POSITIVE
    decisionStrategy: UNANIMOUS
    usersRefs:
      - name: eoepca-user
        namespace: iam-management
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationPermission
metadata:
  name: ${OAPIP_USER}-access
  namespace: iam-management
spec:
  forProvider:
    realmId: ${REALM}
    resourceServerIdRef:
      name: ${OAPIP_CLIENT_ID}
      namespace: iam-management
    name: ${OAPIP_USER}-access
    description: User ${OAPIP_USER} access to /${OAPIP_USER}/*
    type: resource
    decisionStrategy: UNANIMOUS
    resources:
      - ${OAPIP_USER}-resource
    policies:
      - ${OAPIP_USER}-policy
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
