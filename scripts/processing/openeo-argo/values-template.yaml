global:
  env:
    alembicDir: "/opt/openeo_argoworkflows_api/psql"
    apiDns: "openeo.{{ getenv "INGRESS_HOST" }}"
    apiTLS: {{ if eq (getenv "HTTP_SCHEME") "https" }}true{{ else }}false{{ end }}
    apiTitle: "OpenEO ArgoWorkflows"
    apiDescription: "OpenEO API implementation using Dask for distributed processing"
    {{- if eq (getenv "OPENEO_ARGO_ENABLE_OIDC") "yes" }}
    oidcUrl: "{{ getenv "OIDC_ISSUER_URL" }}"
    oidcOrganisation: "{{ getenv "OIDC_ORGANISATION" }}"
    oidcPolicies: "{{ getenv "OIDC_POLICIES" }}"
    oidcProviderTitle: "EOEPCA Keycloak"
    oidcClientId: "openeo-argo"
    {{- else }}
    oidcUrl: "http://dummy-oidc.local/realms/eoepca"
    oidcOrganisation: "eoepca"
    oidcPolicies: ""
    {{- end }}
    stacCatalogueUrl: "{{ getenv "STAC_CATALOG_ENDPOINT" }}"
    workspaceRoot: "/user_workspaces/jobs"
    workspaceMount: "/user_workspaces"
    daskWorkerCores: "4"
    daskWorkerMemory: "8"
    daskWorkerLimit: "6"
    daskClusterTimeout: "3600"
    logLevel: "INFO"

replicaCount: 1

dask-gateway:
  gateway:
    backend:
      worker:
        extraContainerConfig:
          volumeMounts:
            - name: user-workspace
              mountPath: "/user_workspaces"

postgresql:
  # Chart default existingSecret "openeo-postgresql" is created by apply-secrets.sh.
  auth:
    database: "openeo"
  primary:
    persistence:
      storageClass: "{{ getenv "PERSISTENT_STORAGECLASS" }}"
      size: "4Gi"

redis:
  master:
    persistence:
      storageClass: "{{ getenv "PERSISTENT_STORAGECLASS" }}"
      size: "8Gi"
  replica:
    replicaCount: 1
    persistence:
      storageClass: "{{ getenv "PERSISTENT_STORAGECLASS" }}"
      size: "8Gi"

# Mounted ReadWriteMany by multiple pods at once - storage class must support RWX.
persistence:
  storageClassName: "{{ getenv "SHARED_STORAGECLASS" }}"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false