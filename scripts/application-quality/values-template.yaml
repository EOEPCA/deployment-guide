global:
  internalDomain: "svc.cluster.local"

  defaultInternalIssuerRef:
    kind: ClusterIssuer
    name: {{ getenv "INTERNAL_CLUSTER_ISSUER" }}

  defaultExternalIssuerRef:
    kind: ClusterIssuer
    name: {{ getenv "CLUSTER_ISSUER" }}

  grafana:
    enabled: {{ getenv "APP_QUALITY_ENABLE_GRAFANA" "false" }}

grafana:
  enabled: {{ getenv "APP_QUALITY_ENABLE_GRAFANA" "false" }}
  {{- if eq (getenv "APP_QUALITY_ENABLE_GRAFANA" "false") "true" }}
  ingress:
    enabled: true
    ingressClassName: {{ getenv "INGRESS_CLASS" }}
    hosts:
      - {{ getenv "APP_QUALITY_PUBLIC_HOST" }}
    annotations:
      {{- if eq (getenv "INGRESS_CLASS") "apisix" }}
      cert-manager.io/cluster-issuer: {{ getenv "CLUSTER_ISSUER" }}
      k8s.apisix.apache.org/rewrite-target-regex: "/dashboards/?(.*)"
      k8s.apisix.apache.org/rewrite-target-regex-template: "/$1"
      k8s.apisix.apache.org/upstream-read-timeout: "600s"
      k8s.apisix.apache.org/enable-cors: "true"
      {{- if eq (getenv "HTTP_SCHEME") "https" }}
      k8s.apisix.apache.org/http-to-https: "true"
      {{- end }}
      {{- end }}
    path: /dashboards
    pathType: Prefix
    {{- if eq (getenv "HTTP_SCHEME") "https" }}
    tls:
      - secretName: application-quality-tls
        hosts:
          - {{ getenv "APP_QUALITY_PUBLIC_HOST" }}
    {{- end }}

  persistence:
    enabled: true
    storageClassName: {{ getenv "PERSISTENT_STORAGECLASS" }}

  grafana.ini:
    server:
      root_url: {{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}/dashboards
  {{- end }}

application-quality:
  namespace: application-quality

  publicUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}"

  web:
    publicUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}"

  persistence:
    enabled: true
    storageClassName: {{ getenv "PERSISTENT_STORAGECLASS" }}

  calrissian:
    storageClassName: {{ getenv "SHARED_STORAGECLASS" }}

  oidc:
    enabled: {{ getenv "APP_QUALITY_ENABLE_IAM" "false" }}
    {{- if eq (getenv "APP_QUALITY_ENABLE_IAM" "false") "true" }}
    realm: {{ getenv "REALM" }}
    realmBaseUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "KEYCLOAK_HOST" }}/realms/{{ getenv "REALM" }}"
    clientId: {{ getenv "APP_QUALITY_CLIENT_ID" }}
    clientSecret: ""
    postLogoutRedirectUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}/"
    loginRedirectUrl: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}/"
    rpRedirectUri: "{{ getenv "HTTP_SCHEME" }}://{{ getenv "APP_QUALITY_PUBLIC_HOST" }}/"
    {{- end }}

  ingress:
    enabled: true
    className: {{ getenv "INGRESS_CLASS" }}
    domain: {{ getenv "APP_QUALITY_PUBLIC_HOST" }}
    annotations:
      kubernetes.io/ingress.class: {{ getenv "INGRESS_CLASS" }}
      {{- if eq (getenv "INGRESS_CLASS") "apisix" }}
      cert-manager.io/cluster-issuer: {{ getenv "CLUSTER_ISSUER" }}
      apisix.ingress.kubernetes.io/use-regex: "true"
      k8s.apisix.apache.org/upstream-read-timeout: "600s"
      k8s.apisix.apache.org/enable-cors: "true"
      {{- if eq (getenv "HTTP_SCHEME") "https" }}
      k8s.apisix.apache.org/http-to-https: "true"
      {{- end }}
      {{- end }}
      {{- range $key, $value := (datasource "annotations") }}
      {{ $key }}: "{{ $value }}"
      {{- end }}
    {{- if eq (getenv "HTTP_SCHEME") "https" }}
    tls:
      - hosts:
          - {{ getenv "APP_QUALITY_PUBLIC_HOST" }}
        secretName: application-quality-tls
    {{- else }}
    tls: []
    {{- end }}

  notifications:
    enabled: {{ getenv "APP_QUALITY_ENABLE_NOTIFICATIONS" "false" }}
    middleware: "knative"
    brokerName: "default"
    brokerNamespace: "na"
    channelPrefix: "org.eoepca.application-quality"
    responseSource: "/eoepca/application-quality"
    responseTypePrefix: "org.eoepca.application-quality.response"

  automations:
    enabled: false

  sonarqube:
    enabled: {{ getenv "APP_QUALITY_ENABLE_SONARQUBE" "false" }}
    serverUrl: application-quality-sonarqube-sonarqube.application-quality-sonarqube.svc.cluster.local:9000
    accessToken: ""